schema_version: simplis-automation/v2/experiment
name: acot_buck_v84_gold_validation
circuit: acot_buck_v84.yaml
analyses:
  - type: startup
    analysis: tran
    behavior: buck
    group: simplis_tran1
    directives: [.TRAN 400u 0]
    vectors: &buck_vectors
      VOUT: "#VOUT"
      VIN: "#VIN"
      PWM_HS: "#PWM_HS"
      PWM_LS: "#PWM_LS"
      PWM_RAW: "#PWM_RAW"
      PWM_RAW_N: "#PWM_RAW_N"
      SW: "#SW"
      IL: "IPRB_L#P"
      ILOAD: "IPRB_LOAD#P"
      ICOUT: "IPRB_C#P"
      IIN: "IPRB_IN#P"
      RIPPLE: "#CMP_N"
      CMP_P: "#CMP_P"
      CMP_N: "#CMP_N"
      TON_OUT: "#TON_OUT"
      RESET: "#TON_DONE"
    checks: &buck_checks
      vin: 12
      vout_target: 1.2
      fsw_target: 500000
      steady_window_start_s: 0.0003
      vout_error_limit_pct: 1
      startup_window_end_s: 0.0002
      initial_vout_limit_pct: 5
      startup_overshoot_limit_pct: 5
      startup_inductor_min_a: 0
      ccm_min_current: 0
      current_balance_limit_pct: 10
      min_power_ratio: 0.8
      ripple_min: 0.001
      require_ripple_edge_sync: true
      ripple_edge_sync_min_ratio: 0.8
      deadtime_min_s: 1.0e-8
      ton_tolerance_pct: 35
      require_reset_once_per_cycle: true
      reset_vector: RESET
      require_comparator_crossing: true
      pop_cycle_delta_limit_pct: 1

  - type: load_step
    analysis: tran
    behavior: buck
    group: simplis_tran1
    vectors: *buck_vectors
    checks:
      <<: *buck_checks
      load_step_time_s: 0.0002
      load_step_delta_a: 5
      load_step_deviation_limit_pct: 5
      recovery_limit_cycles: 20

  - type: pop_ac
    analysis: ac
    group: simplis_ac1
    # POP represents the already-powered periodic state; keep the real 150 us
    # reference ramp in TRAN, but settle this isolated analysis before its
    # 10 us trigger-search window expires.
    parameters:
      soft_start_time: 100ns
      vref_initial: "${vref}"
      startup_reset_level: 0V
      cout_ic: "${vout_target}"
      lout_ic: "${load_i1} - (${vin} - ${vout_target}) * (${ton_nominal} - ${deadtime}) / (2 * ${lout})"
      ripple_ic: "0V - ${ripple_offset}"
      load_idle_in_pop: 1
    directives:
      - .POP
      - "+ TRIG_GATE={TRIG_GATE}"
      - "+ TRIG_COND=0_TO_1"
      - "+ MAX_PERIOD=5u"
      - "+ CONVERGENCE=1p"
      - "+ CYCLES_BEFORE_LAUNCH=5"
      - "+ TD_RUN_AFTER_POP_FAILS=-1"
      - .AC DEC 50 1k 5Meg
    vectors:
      RETURN: "#FB_DIV"
      INJECT: "#FB"
    response: {numerator: RETURN, denominator: INJECT, sign: -1}

execution:
  startup_timeout_s: 15
  stall_timeout_s: 60
  hard_timeout_s: 240
  poll_interval_s: 2
  transient_sample_points: 10001
  warning_allowlist: []

validation:
  thresholds:
    phase_margin_deg: {min: 45}
    gain_margin_db: {min: 6}
    vout_dc_error_pct: {max: 1}
    load_step_peak_deviation_pct: {max: 5}
    recovery_cycles: {max: 20}
    period_jitter_pct: {max: 5}

optimize:
  backend: coordinate
  max_evaluations: 40
  parameters:
    ton_nominal: {min: 1.2e-7, max: 3.0e-7, initial: 2.0e-7}
    comparator_hysteresis: {min: 0.0005, max: 0.01, initial: 0.002, scale: log}
    deadtime: {min: 1.0e-8, max: 5.0e-8, initial: 2.0e-8}
    ripple_r: {min: 20000, max: 1000000, initial: 500000, scale: log}
    ripple_c: {min: 2.2e-11, max: 2.2e-9, initial: 2.2e-10, scale: log}
    ripple_restore_r: {min: 20000, max: 1000000, initial: 100000, scale: log}
  objective:
    vout_dc_error_pct: {target: 0, weight: 10, sense: min}
    load_step_peak_deviation_pct: {target: 0, weight: 2, sense: min}
    period_jitter_pct: {target: 0, weight: 1, sense: min}
  constraints:
    phase_margin_deg: {min: 45}
    gain_margin_db: {min: 6}
    vout_dc_error_pct: {max: 1}
    load_step_peak_deviation_pct: {max: 5}
    period_jitter_pct: {max: 5}
  esr_continuation: {parameter: cout_esr, target: 0.005, multipliers: [4, 2, 1]}
  corners:
    - {name: vin_low_load_5a, parameters: {vin: 8, load_i2: 5}}
    - {name: vin_nom_load_10a, parameters: {vin: 12, load_i2: 10}}
    - {name: vin_high_load_10a, parameters: {vin: 16, load_i2: 10}}
