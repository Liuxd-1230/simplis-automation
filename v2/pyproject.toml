[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplis-automation-v2"
version = "0.1.0"
description = "Evidence-first SIMetrix/SIMPLIS circuit compiler"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
simplis-v2 = "simplis_automation_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
