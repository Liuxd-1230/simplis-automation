schema_version: simplis-automation/v2/catalog
catalog_id: local-simetrix-8.3-ideal-seed
title: Local SIMetrix/SIMPLIS 8.3 evidence-backed ideal-device seed
purpose: >-
  Small approved catalog for declarative, editable SIMPLIS schematics.  It is
  intentionally conservative: a role is pending until the local symbol,
  pin order, property contract, and SIMPLIS behavior have been established.

runtime:
  product: SIMetrix/SIMPLIS
  version: "8.3"
  executable: D:\\SIMetrix830\\bin64\\SIMetrix.exe
  symbol_library: D:\\SIMetrix830\\support\\symbollibs
  symbol_library_dir: D:\\SIMetrix830\\support\\symbollibs
  symbol_libraries:
    - path: D:\\SIMetrix830\\support\\symbollibs\\passives.sxslb
      sha256: b67b7788514235605d0d5e1d7fa7698178738c068139e42c458121d056fa40f8
