  - {id: probe_q, ref: PQ, kind: voltage_probe, properties: {Label: Q}, pins: {NODE: Q}, group: probes, layout: {x: 7680, y: 1920}}
  - {id: probe_qn, ref: PQN, kind: voltage_probe, properties: {Label: QN}, pins: {NODE: QN}, group: probes, layout: {x: 7680, y: 2880}}
