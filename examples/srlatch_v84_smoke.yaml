      SIMPLIS_VALUE: _V1=0 _V2=5 _FREQ=100k _DELAY=1u _DRATIOx100=10 _T_RISE=1n _T_FALL=1n _DAMP_COEF=0 _PWIDTH=1u _OFF_UNTIL_DELAY=0 _IDLE_IN_POP=0 _USEPHASE=0 _PHASE=0
