    analysis: tran
    behavior: sr_latch
    group: simplis_tran1
    directives: [.TRAN 100u 0]
    vectors: {VOUT: "#VOUT", DRIVE: "#DRIVE", Q: "#Q", QN: "#QN", S: "#SET", R: "#RESET"}
